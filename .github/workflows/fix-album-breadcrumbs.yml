name: Remove album details
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove album details
        if: ${{ hashFiles('.fix-breadcrumbs') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('album-*.html'):
              if '-photos' in p.name:
                  continue
              s=p.read_text(encoding='utf-8')
              if 'album-breadcrumb' not in s:
                  continue
              s=re.sub(r'<p class="eyebrow album-breadcrumb">.*?</p>', '', s, flags=re.S)
              s=re.sub(r'<style>[^<]*\.album-breadcrumb[^<]*</style>', '', s, flags=re.S)
              p.write_text(s,encoding='utf-8')
          Path('.fix-breadcrumbs').unlink(missing_ok=True)
          PY
      - name: Commit fix
        if: ${{ hashFiles('.fix-breadcrumbs') == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add album-*.html .fix-breadcrumbs
          git diff --cached --quiet && exit 0
          git commit -m "Убрать детали с альбомных страниц"
          git push

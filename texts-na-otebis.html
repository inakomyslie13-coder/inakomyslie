<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>На отъебись — Тексты — Инакомыслие</title><style>.text-list{max-width:900px;margin:24px 0}.text-item{margin-bottom:4px}.text-title{display:block;width:100%;padding:9px 0;background:none;border:0;color:var(--text);font:inherit;font-size:1rem;font-weight:700;text-align:left;cursor:pointer}.text-title:hover{text-decoration:underline}.text-view{display:none;padding:16px 0 10px}.text-item.open .text-view{display:block}.text-body{font-size:15px;line-height:1.6;white-space:pre-line;max-width:760px;background:#fff;color:#000;padding:22px 24px;box-sizing:border-box}.text-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.text-button{display:inline-block;padding:7px 11px;border:1px solid #aaa;background:#fff;color:#000;text-decoration:none;cursor:pointer;font:inherit}.text-button:hover{background:#eee}@media(max-width:600px){.text-body{font-size:14px;padding:18px}}</style></head><body class="inner-page scroll-page"><header class="inner-hero"><img src="hero.jpg" alt="Инакомыслие"></header><div class="page-layout"><aside class="page-sidebar"><a class="page-logo" href="index.html"><span class="anarchy-mark">Ⓐ</span><span>Инакомыслие</span></a><nav><a href="index.html">Главная</a><a href="history.html">История</a><a href="albums.html">Дискография</a><a href="photos.html">Фото</a><a href="clips.html">Клипы</a><a class="active" href="texts.html">Тексты</a><a href="contact.html">Связь</a></nav></aside><main class="page-content"><p class="eyebrow">ИНАКОМЫСЛИЕ • НА ОТЪЕБИСЬ</p><h1>На отъебись</h1><p class="songs-intro">Выбери песню, чтобы открыть её текст.</p><div class="text-list" id="text-list"></div><a class="button" href="texts.html" style="margin-top:20px;display:inline-block;">← Назад к текстам</a></main></div><footer class="page-footer"><span>© 2026 Инакомыслие</span></footer><script>const songs=[['Первомайский район','01.ПЕРВОМАЙСКИЙ РАЙОН.txt'],['Алконавт','02.Алконавт.txt'],['Я хочу умереть','03.Я ХОЧУ УМЕРЕТЬ.txt'],['Враг народа','04.ВРАГ НАРОДА.txt'],['Ещё не 30 лет','05.ЕЩЁ НЕ 30 ЛЕТ.txt'],['Звёздная болезнь','06.ЗВЁЗДНАЯ БОЛЕЗНЬ.txt'],['Моё сердце свободно','07.МОЁ СЕРДЦЕ СВОБОДНО.txt'],['Ненавижу попсу','08.НЕНАВИЖУ ПОПСУ.txt'],['О MOONLIGHTом','09.О MOONLIGHTом.txt'],['Продажная жизнь','10.ПРОДАЖНАЯ ЖИЗНЬ.txt'],['Такая жизнь','11.Такая жизнь.txt'],['Боль и кровь','12.Боль и кровь.txt'],['Дядя Фёдор-зоофил','13.Дядя Фёдор-зоофил.txt']];const list=document.getElementById('text-list');songs.forEach((s,i)=>{const item=document.createElement('section');item.className='text-item';item.innerHTML='<button class="text-title" type="button">'+(i+1)+'. '+s[0]+'</button><div class="text-view"><div class="text-body">Загрузка текста…</div><div class="text-actions"><a class="text-button" href="'+encodeURI(s[1])+'" download>⬇ Скачать текст</a><button class="text-button" type="button" onclick="changeSize(this,1)">🔍 Увеличить</button><button class="text-button" type="button" onclick="changeSize(this,-1)">🔎 Уменьшить</button><button class="text-button" type="button" onclick="fullText(this)">⛶ На весь экран</button></div></div>';item.querySelector('.text-title').onclick=function(){openText(this);if(!item.dataset.loaded){fetch(encodeURI(s[1])).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>{item.querySelector('.text-body').textContent=new TextDecoder('windows-1251').decode(b);item.dataset.loaded='1'}).catch(()=>item.querySelector('.text-body').textContent='Не удалось загрузить текст.')}};list.appendChild(item)});function openText(button){document.querySelectorAll('.text-item').forEach(function(item){if(item!==button.closest('.text-item'))item.classList.remove('open')});button.closest('.text-item').classList.toggle('open')}function changeSize(button,delta){var body=button.closest('.text-view').querySelector('.text-body');var size=parseFloat(getComputedStyle(body).fontSize)||15;size=Math.max(12,Math.min(28,size+delta));body.style.fontSize=size+'px'}function fullText(button){var body=button.closest('.text-view').querySelector('.text-body');if(body.requestFullscreen)body.requestFullscreen();else if(body.webkitRequestFullscreen)body.webkitRequestFullscreen()}</script></body></html>

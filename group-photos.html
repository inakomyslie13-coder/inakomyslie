<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Фото группы — Инакомыслие."><meta name="theme-color" content="#080808"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Фото группы — Инакомыслие</title><style>.group-photo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.group-photo-grid figure{margin:0;border:2px solid var(--line);background:#11100f;padding:5px;box-shadow:3px 3px 0 #321311;cursor:pointer}.group-photo-grid img{display:block;width:100%;height:170px;object-fit:cover;background:#080808}.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:30px}.photo-viewer.open{display:flex}.photo-viewer img{max-width:82vw;max-height:78vh;width:auto;height:auto;object-fit:contain;border:2px solid var(--line);box-shadow:6px 6px 0 #321311;background:#080808}.photo-viewer button{position:absolute;border:2px solid var(--line);background:#17120f;color:#eee;font:inherit;padding:9px 13px;cursor:pointer}.photo-close{top:18px;right:18px}.photo-fullscreen{right:18px;bottom:18px}.photo-viewer button:hover{background:#2a1b17}@media(max-width:1100px){.group-photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:800px){.group-photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.group-photo-grid img{height:150px}}@media(max-width:600px){.group-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.group-photo-grid img{height:150px}}@media(max-width:420px){.group-photo-grid{grid-template-columns:1fr}.group-photo-grid img{height:auto;max-height:360px}}</style></head><body class="inner-page scroll-page"><header class="inner-hero"><img src="hero.jpg" alt="Инакомыслие"></header><div class="page-layout"><aside class="page-sidebar"><a class="page-logo" href="index.html"><span

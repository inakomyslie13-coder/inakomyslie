<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Фото группы — Инакомыслие."><meta name="theme-color" content="#080808"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Фото группы — Инакомыслие</title><style>.group-photo-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px}.group-photo-grid figure{margin:0;border:2px solid var(--line);background:#11100f;padding:4px;box-shadow:2px 2px 0 #321311;cursor:pointer;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}.group-photo-grid img{display:block;width:100%;height:100%;object-fit:contain;background:#080808}.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9999;padding:70px 80px}.photo-viewer.open{display:flex}.photo-viewer img{max-width:88vw;max-height:82vh;width:auto;height:auto;object-fit:contain;border:2px solid var(--line);box-shadow:6px 6px 0 #321311;background:#080808}.photo-viewer button{position:absolute;border:2px solid var(--line);background:#17120f;color:#eee;font:inherit;padding:9px 13px;cursor:pointer;z-index:2}.photo-close{top:18px;right:18px}.photo-fullscreen{right:18px;bottom:18px}.photo-prev,.photo-next{top:50%;transform:translateY(-50%);font-size:26px;padding:8px 14px!important}.photo-prev{left:18px}.photo-next{right:18px}.photo-viewer button:hover{background:#2a1b17}@media(max-width:1200px){.group-photo-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:900px){.group-photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.photo-viewer{padding:60px 55px}}@media(max-width:650px){.group-photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo-viewer{padding:60px 45px}.photo-viewer img{max-width:86vw;max-height:75vh}}@media(max-width:450px){.group-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-viewer{padding:55px 35px}.photo-prev{left:7px}.photo-next{right:7px}.photo-fullscreen{right:8px;bottom:8px}.photo-close{top:8px;right:8px}}</style></head><body class="inner-page scroll-page"><header class="inner-hero"><img src="hero.jpg" alt="Инакомыслие"></header><div class="page-layout"><aside class="page-sidebar"><a class="page-logo" href="index.html"><span class="anarchy-mark">Ⓐ</span><span>Инакомыслие</span></a><nav aria-label="Основная навигация"><a href="index.html">Главная</a><a href="history.html">История</a><a href="albums.html">Дискография</a><a class="active" href="photos.html">Фото</a><a href="clips.html">Клипы</a><a href="texts.html">Тексты</a><a href="contact.html">Связь</a></nav><div class="friends-space" aria-label="Сайты друзей и коллег"></div></aside><main class="page-content"><p class="eyebrow">ИНАКОМЫСЛИЕ • ФОТО</p><h1>Фото группы</h1><p class="songs-intro">Фотографии группы.</p><div class="group-photo-grid"><figure><img src="[003316].jpg" alt="Фото группы"></figure><figure><img src="8o7loAg37LY.jpg" alt="Фото группы"></figure><figure><img src="9YXWAxzihcE.jpg" alt="Фото группы"></figure><figure><img src="ava.jpg" alt="Фото группы"></figure><figure><img src="B7orzambrkc.jpg" alt="Фото группы"></figure><figure><img src="d6gJopN4Gcg.jpg" alt="Фото группы"></figure><figure><img src="DpAWvRFeLTM.jpg" alt="Фото группы"></figure><figure><img src="DSC04977.JPG" alt="Фото группы"></figure><figure><img src="fgghhj.jpg" alt="Фото группы"></figure><figure><img src="HWFVPUgRksl3L-oi-43FXbcaLQWKaK6k2ixdgdJWcd-EJwTCXYjJeCDl1nnYUtMFtgqXYgfb_S__w97PDtk45oCR.jpg" alt="Фото группы"></figure><figure><img src="i (2).jpg" alt="Фото группы"></figure><figure><img src="IJoly.jpg" alt="Фото группы"></figure><figure><img src="image (2).jpg" alt="Фото группы"></figure><figure><img src="IMG-20251205-WA0061.jpg" alt="Фото группы"></figure><figure><img src="PKbAJ1zt9T0.jpg" alt="Фото группы"></figure><figure><img src="QIqyGIPOEmI.jpg" alt="Фото группы"></figure><figure><img src="Rishakez_2025.jpg" alt="Фото группы"></figure><figure><img src="Rwkqu.jpg" alt="Фото группы"></figure><figure><img src="Ryzhakez2.jpg" alt="Фото группы"></figure><figure><img src="RZ_Fin_fix_02_02.png" alt="Фото группы"></figure><figure><img src="Rz2.jpg" alt="Фото группы"></figure><figure><img src="vk1654895734001.jpg" alt="Фото группы"></figure><figure><img src="новый коллаж 2.jpg" alt="Фото группы"></figure><figure><img src="паапапапп.jpg" alt="Фото группы"></figure></div><a class="button" href="photos.html">← Назад к разделу Фото</a></main></div><div class="photo-viewer" id="photoViewer" aria-hidden="true"><img id="viewerImage" src="" alt="Фото группы"><button class="photo-close" id="photoClose" type="button">✕ Закрыть</button><button class="photo-prev" id="photoPrev" type="button" aria-label="Предыдущее фото">‹</button><button class="photo-next" id="photoNext" type="button" aria-label="Следующее фото">›</button><button class="photo-fullscreen" id="photoFullscreen" type="button">⛶ На весь экран</button></div><footer class="page-footer"><span>© 2026 Инакомыслие</span></footer><script>(function(){const figures=Array.from(document.querySelectorAll('.group-photo-grid figure'));const viewer=document.getElementById('photoViewer'),image=document.getElementById('viewerImage'),close=document.getElementById('photoClose'),prev=document.getElementById('photoPrev'),next=document.getElementById('photoNext'),full=document.getElementById('photoFullscreen');let index=0;function show(i){index=(i+figures.length)%figures.length;image.src=figures[index].querySelector('img').src;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function hide(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');image.src='';document.body.style.overflow=''}figures.forEach((fig,i)=>fig.addEventListener('click',()=>show(i)));prev.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));viewer.addEventListener('click',e=>{if(e.target===viewer)hide()});close.addEventListener('click',hide);document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});full.addEventListener('click',()=>{if(!document.fullscreenElement){viewer.requestFullscreen&&viewer.requestFullscreen()}else{document.exitFullscreen&&document.exitFullscreen()}});document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'⛶ Выйти из полного экрана':'⛶ На весь экран'})})();</script></body></html>

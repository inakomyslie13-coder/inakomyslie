<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#080808"><title>Админ-панель — Инакомыслие</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:40px auto;padding:24px}.panel{border:1px solid #3a3a3a;background:#111;padding:24px;box-shadow:8px 8px 0 #1d1d1d}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:bold;margin:12px 0 6px}input,select,button{width:100%;padding:12px;background:#080808;color:#fff;border:1px solid #555;font:inherit}button{cursor:pointer;background:#b40000;border-color:#d22;font-weight:bold}.status{margin-top:14px;padding:12px;border:1px solid #333;white-space:pre-wrap}.small{font-size:13px;color:#aaa;line-height:1.5}.hidden{display:none}.ok{border-color:#385f38}.bad{border-color:#713838}.warn{border-left:4px solid #c00;background:#181818;padding:14px;margin:18px 0;line-height:1.5}</style></head><body><div class="wrap"><div class="panel"><h1>Ⓐ Инакомыслие — админка</h1><p class="small">Служебная страница. В основном меню сайта её нет.</p><div class="warn"><b>Важно:</b> токен вводится только в этом окне и не сохраняется. Никому его не передавай.</div><section id="auth"><label for="token">GitHub Personal Access Token</label><input id="token" type="password" autocomplete="off" placeholder="Токен с правом Contents: Read and write"><br><br><button id="login">Проверить доступ</button><div id="authStatus" class="status">Ожидается проверка.</div></section><section id="upload" class="hidden"><h2>Загрузка файла</h2><div class="grid"><div><label for="kind">Тип</label><select id="kind"><option value="audio">Песня</option><option value="cover">Обложка</option><option value="photo">Фото</option><option value="clip">Клип</option><option value="text">Текст песни</option><option value="news">Файл новости</option></select></div><div><label for="album">Альбом</label><select id="album"><option value="punk-revolution">Панк-революция (2015)</option><option value="covers">Каверы (2015)</option><option value="postlove">Постлюбовная адаптация (2016)</option><option value="8-marta">8 марта (2016)</option><option value="adskie-muki">Адские муки (2017)</option><option value="dlya-druzey">Для друзей (2018)</option><option value="na-otebis">На отъебись (2019)</option><option value="unreleased">Неизданное (2021)</option><option value="blevotnya">Блевотня на попсу (2023)</option><option value="freedom">Свобода от рабства (2024)</option><option value="prostokvashino">Трое из Простокваши (панк-сказка) (2026)</option><option value="singles">Синглы</option></select></div></div><div id="trackWrap"><label for="track">Трек</label><select id="track"></select></div><label for="file">Файл</label><input id="file" type="file"><br><br><button id="uploadBtn">Загрузить в репозиторий</button><div id="uploadStatus" class="status">Файл ещё не выбран.</div></section></div></div><script>const OWNER='inakomyslie13-coder',REPO='inakomyslie',BRANCH='main';let token='';const $=id=>document.getElementById(id);const tracks={'punk-revolution':13,'postlove':14,'unreleased':13,'prostokvashino':13,'freedom':13};function status(el,msg,good){el.textContent=msg;el.className='status '+(good?'ok':'bad')}function refreshTracks(){const a=$('album').value,t=$('track');t.innerHTML='';if($('kind').value!=='audio'){t.parentElement.style.display='none';return}t.parentElement.style.display='block';const n=tracks[a]||1;for(let i=1;i<=n;i++){const o=document.createElement('option');o.value=String(i).padStart(2,'0');o.textContent='Трек '+String(i).padStart(2,'0');t.appendChild(o)}}$('kind').onchange=refreshTracks;$('album').onchange=refreshTracks;refreshTracks();$('login').onclick=async()=>{token=$('token').value.trim();if(!token){status($('authStatus'),'Токен не введён.',false);return}status($('authStatus'),'Проверяю доступ…',true);try{const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub ответил '+r.status+'. Проверь токен и его права.');status($('authStatus'),'Доступ подтверждён. Панель разблокирована.',true);$('upload').classList.remove('hidden')}catch(e){token='';status($('authStatus'),e.message,false)}};function safeName(n){return n.normalize('NFKC').replace(/[^\p{L}\p{N}._()\- ]/gu,'').trim().replace(/\s+/g,'-')||'file'}function pathFor(kind,album,name){if(kind==='audio'){const ext=(name.split('.').pop()||'mp3').toLowerCase();return 'media/audio/'+album+'/'+$('track').value+'.'+ext}const n=safeName(name);if(kind==='cover')return 'media/covers/'+album+'/'+n;if(kind==='photo')return 'media/photos/'+n;if(kind==='clip')return 'media/clips/'+n;if(kind==='text')return 'media/texts/'+album+'/'+n;return 'media/news/'+n}$('uploadBtn').onclick=async()=>{const f=$('file').files[0];if(!token)return status($('uploadStatus'),'Сначала проверь доступ.',false);if(!f)return status($('uploadStatus'),'Выбери файл.',false);if(f.size>90*1024*1024)return status($('uploadStatus'),'Файл слишком большой для этой панели.',false);const kind=$('kind').value,album=$('album').value,path=pathFor(kind,album,f.name);status($('uploadStatus'),'Читаю файл…',true);try{const buf=await f.arrayBuffer(),bytes=new Uint8Array(buf);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const content=btoa(binary);const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Добавить файл: '+path,content,branch:BRANCH})});const data=await r.json();if(!r.ok)throw new Error(data.message||('GitHub ответил '+r.status));status($('uploadStatus'),'Готово! Файл загружен:\n'+path+'\n\nДля аудио использовано имя '+$('track').value+'.'+(f.name.split('.').pop()||'mp3').toLowerCase()+'.\nНа странице альбома появится плеер после обновления GitHub Pages.');$('file').value=''}catch(e){status($('uploadStatus'),'Ошибка загрузки: '+e.message,false)}};</script></body></html>

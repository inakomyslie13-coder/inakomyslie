<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="text-viewer.css"><title>Постлюбовная адаптация — Тексты — Инакомыслие</title><style>.text-list{max-width:900px;margin:24px 0}.text-item{margin-bottom:4px}.text-title{display:block;width:100%;padding:9px 0;background:none;border:0;color:var(--text);font:inherit;font-size:1rem;font-weight:700;text-align:left;cursor:pointer}.text-view{display:none;padding:16px 0 10px}.text-item.open .text-view{display:block}.text-body{font-size:15px;line-height:1.6;white-space:pre-line;max-width:760px;background:#fff;color:#000;padding:22px 24px;box-sizing:border-box}.text-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.text-button{display:inline-block;padding:7px 11px;border:1px solid #aaa;background:#fff;color:#000;text-decoration:none;cursor:pointer;font:inherit}</style></head><body class="inner-page scroll-page compact-text-page"><header class="inner-hero"><img src="hero.jpg" alt="Инакомыслие"></header><div class="page-layout"><aside class="page-sidebar"><a class="page-logo" href="index.html"><span class="anarchy-mark">Ⓐ</span><span>Инакомыслие</span></a><nav><a href="index.html">Главная</a><a href="history.html">История</a><a href="albums.html">Дискография</a><a href="photos.html">Фото</a><a href="clips.html">Клипы</a><a class="active" href="texts.html">Тексты</a><a href="contact.html">Связь</a></nav></aside><main class="page-content"><p class="eyebrow">ИНАКОМЫСЛИЕ • ПОСТЛЮБОВНАЯ АДАПТАЦИЯ</p><h1>Постлюбовная адаптация</h1><p class="songs-intro">Выбери песню, чтобы открыть её текст.</p><div class="text-list" id="text-list"></div><a class="button" href="texts.html" style="margin-top:20px;display:inline-block;">← Назад к текстам</a></main></div><footer class="page-footer"><span>© 2026 Инакомыслие</span></footer><script>const songs=[['Вступление','01.Вступление.txt'],['Исповедь','02.ИСПОВЕДЬ.txt'],['Такая как есть','03.Какая как есть.txt'],['Подруга по жизни','04.ПОДРУГА ПО ЖИЗНИ.txt'],['Постлюбовная адаптация','05.ПОСТЛЮБОВНАЯ АДАПТАЦИЯ.txt'],['Постлюбовная адаптация (версия 2)','06.ПОСТЛЮБОВНАЯ АДАПТАЦИЯ (Версия 2).txt'],['День рождения','07.День рождения.log'],['Прости меня','08.ПРОСТИ МЕНЯ.txt'],['Смутное время','09.СМУТНОЕ ВРЕМЯ.txt'],['Последнее прости','10.ПОСЛЕДНЕЕ ПРОСТИ.txt'],['Вместе навсегда','11.ВМЕСТЕ НАВСЕГДА.txt'],['Лжеподруга','12.ЛЖЕПОДРУГА.txt']];const list=document.getElementById('text-list');function decodeText(b){try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1251').decode(b)}}songs.forEach((s,i)=>{const item=document.createElement('section');item.className='text-item';item.innerHTML='<button class="text-title" type="button">'+(i+1)+'. '+s[0]+'</button><div class="text-view"><div class="text-body">Загрузка текста…</div><div class="text-actions"><a class="text-button" href="'+encodeURI(s[1])+'" download>⬇ Скачать текст</a><button class="text-button" type="button" onclick="changeSize(this,1)">🔍 Увеличить</button><button class="text-button" type="button" onclick="changeSize(this,-1)">🔎 Уменьшить</button><button class="text-button" type="button" onclick="fullText(this)">⛶ На весь экран</button></div></div>';item.querySelector('.text-title').onclick=function(){document.querySelectorAll('.text-item').forEach(x=>{if(x!==item)x.classList.remove('open')});item.classList.toggle('open');if(!item.dataset.loaded)fetch(encodeURI(s[1]),{cache:'no-store'}).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>{item.querySelector('.text-body').textContent=decodeText(b);item.dataset.loaded='1'}).catch(()=>item.querySelector('.text-body').textContent='Не удалось загрузить текст.')};list.appendChild(item)});function changeSize(button,delta){var body=button.closest('.text-view').querySelector('.text-body');var size=parseFloat(getComputedStyle(body).fontSize)||15;body.style.fontSize=Math.max(12,Math.min(28,size+delta))+'px'}function fullText(button){var body=button.closest('.text-view').querySelector('.text-body');if(body.requestFullscreen)body.requestFullscreen();else if(body.webkitRequestFullscreen)body.webkitRequestFullscreen()}</script><script src="text-viewer.js?v=20260912fix1"></script></body></html>

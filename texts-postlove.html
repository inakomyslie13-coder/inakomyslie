<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Постлюбовная адаптация — Тексты — Инакомыслие</title><style>
.text-list{max-width:900px;margin:24px 0}.text-item{margin-bottom:4px}.text-title{display:block;width:100%;padding:9px 0;background:none;border:0;color:var(--text);font:inherit;font-size:1rem;font-weight:700;text-align:left;cursor:pointer}.text-title:hover{text-decoration:underline}.text-view{display:none;padding:16px 0 10px}.text-item.open .text-view{display:block}.text-body{font-size:15px;line-height:1.6;white-space:pre-line;max-width:760px;background:#fff;color:#000;padding:22px 24px;box-sizing:border-box}.text-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.text-button{display:inline-block;padding:7px 11px;border:1px solid #aaa;background:#fff;color:#000;text-decoration:none;cursor:pointer;font:inherit}.text-button:hover{background:#eee}.text-size{font-size:12px;color:#777;align-self:center}@media(max-width:600px){.text-body{font-size:14px;padding:18px}.text-view{padding-top:10px}}
</style></head><body class="inner-page scroll-page"><header class="inner-hero"><img src="hero.jpg" alt="Инакомыслие"></header><div class="page-layout"><aside class="page-sidebar"><a class="page-logo" href="index.html"><span class="anarchy-mark">Ⓐ</span><span>Инакомыслие</span></a><nav aria-label="Основная навигация"><a href="index.html">Главная</a><a href="history.html">История</a><a href="albums.html">Дискография</a><a href="photos.html">Фото</a><a href="clips.html">Клипы</a><a class="active" href="texts.html">Тексты</a><a href="contact.html">Связь</a></nav><div class="friends-space"></div></aside><main class="page-content"><p class="eyebrow">ИНАКОМЫСЛИЕ • ПОСТЛЮБОВНАЯ АДАПТАЦИЯ</p><h1>Постлюбовная адаптация</h1><p class="songs-intro">Выбери песню, чтобы открыть её текст.</p><div class="text-list" id="text-list"></div><a class="button" href="texts.html" style="margin-top:20px;display:inline-block;">← Назад к текстам</a></main></div><footer class="page-footer"><span>© 2026 Инакомыслие</span></footer><script>
const songs=[
['Вступление','01.Вступление.txt'],['ИСПОВЕДЬ','02.ИСПОВЕДЬ.txt'],['Какая как есть','03.Какая как есть.txt'],['ПОДРУГА ПО ЖИЗНИ','04.ПОДРУГА ПО ЖИЗНИ.txt'],['ПОСТЛЮБОВНАЯ АДАПТАЦИЯ','05.ПОСТЛЮБОВНАЯ АДАПТАЦИЯ.txt'],['ПОСТЛЮБОВНАЯ АДАПТАЦИЯ (Версия 2)','06.ПОСТЛЮБОВНАЯ АДАПТАЦИЯ (Версия 2).txt'],['День рождения','07.День рождения.log'],['ПРОСТИ МЕНЯ','08.ПРОСТИ МЕНЯ.txt'],['СМУТНОЕ ВРЕМЯ','09.СМУТНОЕ ВРЕМЯ.txt'],['ПОСЛЕДНЕЕ ПРОСТИ','10.ПОСЛЕДНЕЕ ПРОСТИ.txt'],['ВМЕСТЕ НАВСЕГДА','11.ВМЕСТЕ НАВСЕГДА.txt'],['ЛЖЕПОДРУГА','12.ЛЖЕПОДРУГА.txt']];
const list=document.getElementById('text-list');
songs.forEach((s,i)=>{const item=document.createElement('section');item.className='text-item';item.innerHTML='<button class="text-title" type="button">'+(i+1)+'. '+s[0]+'</button><div class="text-view"><div class="text-body">Загрузка текста…</div><div class="text-actions"><a class="text-button" href="'+encodeURI(s[1])+'" download>⬇ Скачать текст</a><button class="text-button" type="button" data-delta="1">🔍 Увеличить</button><button class="text-button" type="button" data-delta="-1">🔎 Уменьшить</button><button class="text-button" type="button" data-full="1">⛶ На весь экран</button></div></div>';const title=item.querySelector('.text-title');title.onclick=()=>{document.querySelectorAll('.text-item').forEach(x=>{if(x!==item)x.classList.remove('open')});item.classList.toggle('open');if(!item.dataset.loaded){fetch(encodeURI(s[1])).then(r=>r.ok?r.text():Promise.reject()).then(t=>{item.querySelector('.text-body').textContent=t;item.dataset.loaded='1'}).catch(()=>item.querySelector('.text-body').textContent='Не удалось загрузить текст.');}};item.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{const body=item.querySelector('.text-body');let z=parseFloat(getComputedStyle(body).fontSize)||15;z=Math.max(12,Math.min(28,z+Number(b.dataset.delta)));body.style.fontSize=z+'px'});item.querySelector('[data-full]').onclick=()=>{const body=item.querySelector('.text-body');if(body.requestFullscreen)body.requestFullscreen();else if(body.webkitRequestFullscreen)body.webkitRequestFullscreen()};list.appendChild(item)});
[['СМУТНОЕ ВРЕМЯ (Караоке)'],['ПОСТЛЮБОВНАЯ АДАПТАЦИЯ (Караоке)']].forEach((s,j)=>{const i=songs.length+j+1;const item=document.createElement('section');item.className='text-item';item.innerHTML='<button class="text-title" type="button">'+i+'. '+s[0]+'</button><div class="text-view"><div class="text-body">Текст отсутствует — это инструментальная версия.</div><div class="text-actions"><button class="text-button" type="button" data-delta="1">🔍 Увеличить</button><button class="text-button" type="button" data-delta="-1">🔎 Уменьшить</button><button class="text-button" type="button" data-full="1">⛶ На весь экран</button></div></div>';item.querySelector('.text-title').onclick=()=>{document.querySelectorAll('.text-item').forEach(x=>{if(x!==item)x.classList.remove('open')});item.classList.toggle('open')};item.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{const body=item.querySelector('.text-body');let z=parseFloat(getComputedStyle(body).fontSize)||15;z=Math.max(12,Math.min(28,z+Number(b.dataset.delta)));body.style.fontSize=z+'px'});item.querySelector('[data-full]').onclick=()=>{const body=item.querySelector('.text-body');if(body.requestFullscreen)body.requestFullscreen()};list.appendChild(item)});
</script></body></html>

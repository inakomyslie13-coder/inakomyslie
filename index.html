<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Инакомыслие — песни, тексты, история и творчество РыжакеZ.">
<meta name="theme-color" content="#080808">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<title>Инакомыслие — РыжакеZ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
<a class="logo" href="index.html">Ⓐ Инакомыслие <span>РыжакеZ</span></a>
<button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="main-nav">☰</button>
<nav id="main-nav" aria-label="Основная навигация">
<a class="active" href="index.html">Главная</a><a href="history.html">История</a><a href="albums.html">Альбомы</a><a href="photos.html">Фото</a><a href="songs.html">Песни</a><a href="clips.html">Клипы</a><a href="texts.html">Тексты</a><a href="contact.html">Связь</a>
</nav>
</header>
<main id="top">
<section class="hero-banner"><img src="hero.jpg" alt="Инакомыслие — РыжакеZ"></section>
<section class="news-ticker" aria-label="Лента новостей"><div class="news-label">Лента новостей</div><div class="news-placeholder">Новости и обновления сайта будут появляться здесь.</div></section>
<section class="section"><div class="section-heading"><p class="eyebrow">ИНАКОМЫСЛИЕ</p><h1>Главная</h1><p>Официальная страница проекта. Здесь будут последние новости и новые материалы.</p></div></section>
</main>
<footer><span>© 2026 Инакомыслие</span><a href="#top">Наверх ↑</a></footer>
<script>
const b=document.querySelector('.menu-toggle'),n=document.querySelector('#main-nav');
const closeMenu=()=>{n.classList.remove('open');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Открыть меню')};
b.addEventListener('click',()=>{const o=n.classList.toggle('open');b.setAttribute('aria-expanded',String(o));b.setAttribute('aria-label',o?'Закрыть меню':'Открыть меню')});
n.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('click',e=>{if(n.classList.contains('open')&&!n.contains(e.target)&&!b.contains(e.target))closeMenu()});
</script>
</body>
</html>

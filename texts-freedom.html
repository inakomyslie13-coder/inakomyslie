const list=document.getElementById('text-list');
songs.forEach((s,i)=>{const item=document.createElement('section');item.className='text-item';item.innerHTML='<button class="text-title" type="button">'+(i+1)+'. '+s[0]+'</button><div class="text-view"><div class="text-body">Загрузка текста…</div><div class="text-actions"><a class="text-button" href="'+encodeURI(s[1])+'" download>⬇ Скачать текст</a><button class="text-button" type="button" onclick="changeSize(this,1)">🔍 Увеличить</button><button class="text-button" type="button" onclick="changeSize(this,-1)">🔎 Уменьшить</button><button class="text-button" type="button" onclick="fullText(this)">⛶ На весь экран</button></div></div>';item.querySelector('.text-title').onclick=function(){openText(this);if(!item.dataset.loaded){fetch(encodeURI(s[1])).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>{item.querySelector('.text-body').textContent=new TextDecoder('windows-1251').decode(b);item.dataset.loaded='1'}).catch(()=>item.querySelector('.text-body').textContent='Не удалось загрузить текст.')}};list.appendChild(item)});
